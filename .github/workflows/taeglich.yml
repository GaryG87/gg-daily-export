name: Täglicher Export

on:
  schedule:
    # 05:17 UTC = 07:17 Ortszeit, nach dem morgendlichen Garmin-Sync
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      tage:
        description: "Wie viele Tage rückwirkend holen (1-180)"
        required: false
        default: "10"
      detailtage:
        description: "Für wie viele Tage die Yazio-Einzelprodukte auflösen"
        required: false
        default: "14"
      rohdaten:
        description: "Rohdaten-Beispiele mitschreiben (ja/nein)"
        required: false
        default: "nein"

permissions:
  contents: write

concurrency:
  group: taeglicher-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliotheken installieren
        run: pip install "garminconnect==0.3.9" "requests>=2.31"

      # Beide Schritte laufen unabhängig: fällt einer aus, holt der andere
      # trotzdem seine Daten. Geprüft wird erst nach dem Commit.
      - name: Garmin holen
        continue-on-error: true
        env:
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
          GARMIN_USER: ${{ secrets.GARMIN_USER }}
          DAYS: ${{ inputs.tage || '10' }}
          RAW_SAMPLE: ${{ inputs.rohdaten || 'nein' }}
        run: python garmin_export.py

      - name: Yazio holen
        continue-on-error: true
        env:
          YAZIO_USER: ${{ secrets.YAZIO_USER }}
          YAZIO_PASS: ${{ secrets.YAZIO_PASS }}
          DAYS: ${{ inputs.tage || '10' }}
          DETAIL_DAYS: ${{ inputs.detailtage || '14' }}
          RAW_SAMPLE: ${{ inputs.rohdaten || 'nein' }}
        run: python yazio_export.py

      - name: Ergebnis committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export/
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Export $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # Erst NACH dem Commit prüfen. So sind die Daten gesichert, aber der
      # Lauf wird trotzdem rot - und GitHub schickt eine Fehlermail.
      # Ohne diesen Schritt meldet der Workflow grün, während eine Quelle
      # seit Tagen ausgefallen ist (genau das ist im August 2026 passiert).
      - name: Ergebnis prüfen und bei Fehler Alarm schlagen
        if: always()
        run: |
          python - <<'PY'
          import json, sys, datetime, pathlib

          heute = datetime.date.today()
          probleme = []

          for name in ("garmin", "yazio"):
              pfad = pathlib.Path(f"export/{name}.json")
              if not pfad.exists():
                  probleme.append(f"{name}: Datei fehlt komplett")
                  continue
              d = json.loads(pfad.read_text(encoding="utf-8"))

              if d.get("status") != "ok":
                  probleme.append(f"{name}: {d.get('fehler')}")

              tage = d.get("tage") or []
              if tage:
                  letzter = datetime.date.fromisoformat(tage[-1]["datum"])
                  alter = (heute - letzter).days
                  print(f"{name}: letzter Tag {letzter} ({alter} Tage alt)")
                  if alter > 2:
                      probleme.append(
                          f"{name}: Daten sind {alter} Tage alt "
                          f"(letzter Tag {letzter})"
                      )
              else:
                  probleme.append(f"{name}: keine Tagesdaten enthalten")

          if probleme:
              print("\n*** EXPORT-PROBLEME ***")
              for p in probleme:
                  print(" -", p)
              print("\nBei 'Failed to retrieve social profile' oder 401 ist das "
                    "Garmin-Token abgelaufen: garmin_token.py lokal neu "
                    "ausfuehren und Secret GARMIN_TOKENS_B64 ersetzen.")
              sys.exit(1)

          print("Beide Quellen aktuell.")
          PY
