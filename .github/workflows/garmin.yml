name: Garmin Export

on:
  schedule:
    # 05:17 UTC = 07:17 Ortszeit. Bewusst nach dem morgendlichen Sync,
    # damit die Schlafdaten der Nacht schon bei Garmin liegen.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      tage:
        description: "Wie viele Tage rueckwirkend holen (1-180)"
        required: false
        default: "10"
      rohdaten:
        description: "Rohdaten-Beispiel mitschreiben (ja/nein)"
        required: false
        default: "ja"

permissions:
  contents: write

concurrency:
  group: garmin-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliothek installieren
        run: pip install "garminconnect==0.3.9"

      - name: Garmin-Daten holen
        continue-on-error: true
        env:
          GARMIN_USER: ${{ secrets.GARMIN_USER }}
          GARMIN_PASS: ${{ secrets.GARMIN_PASS }}
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
          DAYS: ${{ inputs.tage || '10' }}
          RAW_SAMPLE: ${{ inputs.rohdaten || 'ja' }}
        run: python garmin_export.py

      - name: Ergebnis committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export/
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Garmin-Export $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
